
# config/auth_config.yaml - Authentication configuration
cookie:
  expiry_days: 30
  key: "your_cookie_key_here_make_it_long_and_random_12345"
  name: "chatbot_auth_cookie"

credentials:
  usernames:
    admin:
      email: admin@chatbot.com
      failed_login_attempts: 0
      first_name: Admin
      last_name: User
      logged_in: False
      password: admin123  # Will be hashed automatically
      roles:
        - admin
        - user
    demo_user:
      email: demo@chatbot.com
      failed_login_attempts: 0
      first_name: Demo
      last_name: User
      logged_in: False
      password: demo123  # Will be hashed automatically
      roles:
        - user

pre-authorized:
  emails:
    - user@example.com
    - test@example.com

# Optional OAuth2 configuration (replace with your own credentials)
oauth2:
  google:
    client_id: "YOUR_GOOGLE_CLIENT_ID_HERE"
    client_secret: "YOUR_GOOGLE_CLIENT_SECRET_HERE"
    redirect_uri: "http://localhost:8501/oauth2callback"

# Optional API key for enhanced features
api_key: "YOUR_API_KEY_HERE"
